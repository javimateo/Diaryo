[package]
name = "diaryo"
version = "0.2.0"
description = "Diario infinito: cada página es un lienzo sin límites para dibujar, escribir y conectar ideas."
authors = ["Javier Mateo"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "diaryo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# Saber si la ventana que está delante es de otra app (para apartar el diario flotante) y
# la mesa en el escritorio (detrás de las ventanas, dejando pasar los clics).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
