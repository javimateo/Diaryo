# The website: static pages (/ and /en/), with long caching for the hashed files.
map $uri $cache_control {
  ~^/_astro/ "public, max-age=31536000, immutable";
  default "";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # Headers here and none in the locations (a location with its own add_header would drop
  # these). The pages hold nobody's data, so the CSP doesn't limit scripts (that would need
  # the hashes of each build's inline ones): it stops the site from being framed, plugins,
  # a changed <base> and forms sent anywhere.
  add_header Cache-Control $cache_control;
  add_header Content-Security-Policy "object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  location / {
    try_files $uri $uri/ $uri.html =404;
  }
}
