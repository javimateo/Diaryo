# The web app: one page; every path goes to it. The hashed files are cached for good,
# the page itself never (so a new version arrives at once).
map $uri $cache_control {
  ~^/assets/ "public, max-age=31536000, immutable";
  default "no-cache";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # Headers here and none in the locations (a location with its own add_header would drop
  # these). The page only runs its own code and only talks to the cloud server (as the
  # desktop app, src-tauri/tauri.conf.json): a script slipped into a diary can't run, nor
  # send what it reads. The emails' links carry a token in the address: no referrer.
  add_header Cache-Control $cache_control;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://cloud.diaryo.javiermateo.dev; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  location /assets/ {
  }

  location / {
    try_files $uri /index.html;
  }
}
