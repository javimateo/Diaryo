# Builds the Windows installer when a version tag (v0.2.0…) is pushed and leaves a draft
# release with it, the update file (latest.json, signed) and notes from the commits.
# Publishing the draft is what reaches the installed apps.
#
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (the content of the private
# updater key) and, if the key has one, TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          # Required to create the release (the notes below are generated by GitHub).
          releaseName: diaryo ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          # Title and notes from GitHub (the commits since the previous version).
          generateReleaseNotes: true
          uploadUpdaterJson: true
