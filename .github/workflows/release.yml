# Builds the Windows installer when a version tag (v0.2.0…) is pushed and leaves a draft
# release with it, the update file (latest.json, signed) and notes from the commits.
# Publishing the draft is what reaches the installed apps.
#
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (the content of the private
# updater key) and, if the key has one, TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ['v*']

# The actions are pinned to a commit: this workflow holds the updater key.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          # Required to create the release (the notes below are generated by GitHub).
          releaseName: diaryo ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          # Title and notes from GitHub (the commits since the previous version).
          generateReleaseNotes: true
          uploadUpdaterJson: true
