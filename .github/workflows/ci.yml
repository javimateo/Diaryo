# The checks of CONTRIBUTING.md on every push to develop or main and on every pull
# request: the app's types, lint, tests and format (of the whole repository), the desktop
# side (on Windows, where its code runs), the website, the cloud server's rules against its
# own image, and the images of the website and the web app.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npx vitest run
      - run: npx prettier --check .

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      # The website's demo uses the app's code: both sets of dependencies.
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm --prefix web run check
      - run: npm --prefix web run build

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      # Tauri embeds the built page (`frontendDist`): an empty folder is enough to check it.
      - run: mkdir ../dist
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The server's own image (deploy/cloud.Dockerfile: its PocketBase, schema and rules,
  # its user), started on an empty volume owned by root, as the ones from 1.0.0 are.
  cloud:
    runs-on: ubuntu-latest
    env:
      PB_URL: http://127.0.0.1:8090
      PB_ADMIN_EMAIL: ci@diaryo.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Server image
        run: |
          docker build -f deploy/cloud.Dockerfile -t diaryo-cloud .
          docker run -d --name cloud -p 127.0.0.1:8090:8090 -v pb_data:/pb/pb_data diaryo-cloud
          curl -fs --retry 30 --retry-delay 1 --retry-all-errors "$PB_URL/api/health"
      - name: It doesn't run as root
        run: test "$(docker exec cloud stat -c %U /proc/1)" = pocketbase
      # A throwaway administrator for this run only, made from the container's terminal (as
      # in Coolify), with its second factor.
      - name: Administrator
        run: |
          password=$(openssl rand -hex 16)
          echo "PB_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          docker exec cloud /pb/pocketbase superuser upsert "$PB_ADMIN_EMAIL" "$password" --dir=/pb/pb_data
          otp=$(docker exec cloud /pb/pocketbase superuser otp "$PB_ADMIN_EMAIL" --dir=/pb/pb_data)
          echo "PB_ADMIN_OTP_ID=$(echo "$otp" | sed -n 's/.*Id: *//p')" >> "$GITHUB_ENV"
          echo "PB_ADMIN_OTP=$(echo "$otp" | sed -n 's/.*Pass: *//p')" >> "$GITHUB_ENV"
      - run: node cloud/check.mjs
      - if: failure()
        run: docker logs cloud

  # The website's and the web app's images build, and their nginx accepts its configuration.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Web app
        run: |
          docker build -f deploy/app.Dockerfile -t diaryo-app .
          docker run --rm diaryo-app nginx -t
      - name: Website
        run: |
          docker build -f deploy/web.Dockerfile -t diaryo-web .
          docker run --rm diaryo-web nginx -t
