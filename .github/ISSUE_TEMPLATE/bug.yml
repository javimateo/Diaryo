name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it! For a **security issue**, don't open an issue: see [SECURITY.md](https://github.com/javimateo/Diaryo/blob/main/SECURITY.md).
        Please don't paste anything private from your diary.
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. …
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Desktop app (Windows)
        - Web app on a computer
        - Web app on a phone
        - Website
        - Cloud sync
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The desktop app shows it in Settings → General; for the web app, the browser.
      placeholder: 1.0.0, Windows 11 / Chrome 140 on Android
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
